<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">MLCatie system overview</title>
  <desc id="desc">The React client connects to Firebase Authentication, Realtime Database, and Storage, and sends text to a separate sentiment API backed by jieba, Word2Vec, and an LSTM model.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8e8"/>
      <stop offset="1" stop-color="#8b4df5"/>
    </linearGradient>
    <linearGradient id="clientFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#f4efff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#23304a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#74809a"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .section { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; fill: #68738b; }
      .title { font-size: 23px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #657089; }
      .small { font-size: 13px; fill: #657089; }
      .line { fill: none; stroke: #74809a; stroke-width: 2.5; marker-end: url(#arrow); }
      .bidirectional { marker-start: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="460" rx="28" fill="#fbfcff"/>
  <path d="M0 0h360L250 460H0z" fill="#f7f9fe"/>
  <circle cx="1100" cy="55" r="130" fill="#f6f0ff" opacity="0.75"/>

  <text class="label section" x="70" y="72">USER EXPERIENCE</text>
  <text class="label section" x="435" y="72">MANAGED BACKEND</text>
  <text class="label section" x="835" y="72">MODEL SERVICE</text>

  <g filter="url(#shadow)">
    <rect x="70" y="125" width="270" height="210" rx="22" fill="url(#clientFill)" stroke="#b9c9eb" stroke-width="2"/>
    <rect x="94" y="151" width="52" height="52" rx="14" fill="url(#accent)"/>
    <path d="M108 168h24M108 177h24M108 186h15" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text class="label title" x="94" y="237">React client</text>
    <text class="label subtitle" x="94" y="267">Channels, direct messages,</text>
    <text class="label subtitle" x="94" y="291">presence, files, and emotion UI</text>
    <rect x="94" y="311" width="132" height="4" rx="2" fill="url(#accent)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="435" y="105" width="300" height="90" rx="18" fill="#fff" stroke="#dce2ee" stroke-width="2"/>
    <circle cx="475" cy="150" r="20" fill="#fff3d6"/>
    <path d="M467 151l6 6 11-14" fill="none" stroke="#f4a620" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label title" x="510" y="145">Authentication</text>
    <text class="label small" x="510" y="169">Email and password sessions</text>

    <rect x="435" y="215" width="300" height="90" rx="18" fill="#fff" stroke="#dce2ee" stroke-width="2"/>
    <circle cx="475" cy="260" r="20" fill="#e7f8ef"/>
    <path d="M463 252h24M463 260h24M463 268h24" stroke="#27a66a" stroke-width="3" stroke-linecap="round"/>
    <text class="label title" x="510" y="255">Realtime Database</text>
    <text class="label small" x="510" y="279">Messages, typing, and presence</text>

    <rect x="435" y="325" width="300" height="90" rx="18" fill="#fff" stroke="#dce2ee" stroke-width="2"/>
    <circle cx="475" cy="370" r="20" fill="#e8f2ff"/>
    <path d="M464 376h22v-16h-11l-4-5h-7z" fill="none" stroke="#3f84d9" stroke-width="3" stroke-linejoin="round"/>
    <text class="label title" x="510" y="365">Storage</text>
    <text class="label small" x="510" y="389">JPEG and PNG attachments</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="835" y="125" width="295" height="130" rx="22" fill="#fff" stroke="#cfc1f3" stroke-width="2"/>
    <rect x="859" y="151" width="52" height="52" rx="14" fill="url(#accent)"/>
    <path d="M871 178h28M879 170l-8 8 8 8M891 170l8 8-8 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label title" x="930" y="176">Sentiment API</text>
    <text class="label subtitle" x="859" y="228">HTTP inference boundary</text>

    <rect x="835" y="285" width="295" height="130" rx="22" fill="#272c3b"/>
    <text x="859" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#aeb8ce">INFERENCE PIPELINE</text>
    <text x="859" y="354" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#fff">jieba</text>
    <text x="906" y="354" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#aeb8ce">→</text>
    <text x="930" y="354" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#fff">Word2Vec</text>
    <text x="1024" y="354" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#aeb8ce">→</text>
    <text x="1048" y="354" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#fff">LSTM</text>
    <text x="859" y="385" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#aeb8ce">Positive sentiment probability</text>
  </g>

  <path class="line" d="M340 170 C385 170 390 150 435 150"/>
  <text class="label small" x="365" y="137">session</text>

  <path class="line bidirectional" d="M340 255 C385 255 390 260 435 260"/>
  <text class="label small" x="358" y="238">realtime data</text>

  <path class="line bidirectional" d="M340 310 C390 310 390 370 435 370"/>
  <text class="label small" x="363" y="356">attachments</text>

  <path class="line" d="M340 335 C365 415 410 435 500 435 L775 435 C810 435 810 190 835 190"/>
  <rect x="548" y="420" width="112" height="28" rx="14" fill="#fbfcff"/>
  <text class="label small" x="565" y="439">message text</text>

  <path class="line bidirectional" d="M982 255 L982 285"/>
  <text class="label small" x="995" y="276">inference</text>
</svg>
